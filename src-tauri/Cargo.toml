[package]
name = "datacore"
version = "0.1.0"
description = "A lightweight native macOS database manager"
authors = ["chanchai"]
edition = "2021"

[lib]
name = "datacore_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
csv = "1.3"
flate2 = "1"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
duckdb = { version = "1.2", features = ["bundled"] }
tiberius = { version = "0.13", default-features = false, features = ["chrono", "tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
futures = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
aes-gcm = { version = "0.11", features = ["rand_core"] }
argon2 = "0.5"
rand = "0.10.3"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
tempfile = "3.27.0"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["javascript", "typescript"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
